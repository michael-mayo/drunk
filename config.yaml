# Central configuration for the drunk project.
# All key parameters and settings are read from this file via app/config.py.
# Relative paths are resolved against the directory containing this file.

# main.py builds one map per seed; each seed drives the RNG that generates
# that map's drunk seeds and homes.
seeds: [41, 42, 43]

# The height map is the weighted sum of layers, each a CompositeDrunk of
# identical drunks at one scale. A layer at scale s multiplies walk.step_size
# and walk.r0 by s and deposit.variance by s^2. Within a layer the drunks
# differ only in their random seed, home (Poisson-disk sampled over the world)
# and kappa_max, which uses power-log spacing: member i of n gets
#   kappa_max_start * (kappa_max_end / kappa_max_start) ** (t ** kappa_max_power),
# with t = i / (n - 1) (both ends > 0; power 1 = logarithmic, > 1 crowds the
# drunks towards kappa_max_start). Each layer is scaled to unit standard
# deviation, multiplied by its weight, and the sum is scaled to [0, 1].
#
# The four fine layers (scales 0.5-4, 200 drunks per 96 x 96 playable area,
# weights (s / 0.5)^0.5) give the small-scale texture tuned against real
# terrain. The two coarse ones are few, strongly biased drunks making
# continent-sized land masses and seas: without them the largest features
# are ~4 km across and the 57 km world looks uniform. A scale-16 weight of 6
# (rather than 8) keeps the continents and keeps every playable-sized window
# close to real terrain (check with util/nature_check.py).
#
# born_on_parent: the share of a layer's drunks (0-1) born on the paths of
# the next larger layer's drunks (home = one of the parent layer's deposit
# centres) instead of at evenly spread homes, so they gather on the high
# ground the larger drunks build. Layers are built largest first. 0 = all
# spread evenly; the largest layer must be 0. parent_bias_power: a born drunk
# picks its parent drunk with probability proportional to the parent's
# kappa_max ** parent_bias_power, favouring the strongly biased parents that
# stay home and build peaks over the wanderers that criss-cross the lowlands
# (0 = any parent alike). 4 keeps fine texture on the mountains and leaves
# lowlands and coasts smooth.
layers:
  - {scale: 0.5, drunks: 3200, kappa_max_start: 0.01, kappa_max_end: 0.4, kappa_max_power: 4.0, weight: 1.0, born_on_parent: 1.0, parent_bias_power: 4.0}
  - {scale: 1.0, drunks: 3200, kappa_max_start: 0.01, kappa_max_end: 0.4, kappa_max_power: 4.0, weight: 1.414, born_on_parent: 1.0, parent_bias_power: 4.0}
  - {scale: 2.0, drunks: 3200, kappa_max_start: 0.01, kappa_max_end: 0.4, kappa_max_power: 4.0, weight: 2.0, born_on_parent: 1.0, parent_bias_power: 4.0}
  - {scale: 4.0, drunks: 3200, kappa_max_start: 0.01, kappa_max_end: 0.4, kappa_max_power: 4.0, weight: 2.828, born_on_parent: 1.0, parent_bias_power: 4.0}
  - {scale: 8.0, drunks: 200, kappa_max_start: 0.05, kappa_max_end: 1.0, kappa_max_power: 1.0, weight: 4.0, born_on_parent: 1.0, parent_bias_power: 4.0}
  - {scale: 16.0, drunks: 50, kappa_max_start: 0.05, kappa_max_end: 1.0, kappa_max_power: 1.0, weight: 6.0, born_on_parent: 0.0, parent_bias_power: 0.0}

parallel:
  # Threads used by the compiled (numba) walking and deposit kernels
  # (null = every core). Results are identical whatever the number.
  threads: null

walk:
  # Number of steps each drunk takes.
  num_steps: 1000
  # Distance moved on each step.
  step_size: 1.0
  # Homeward bias: step directions follow a von Mises distribution centred on
  # the direction back to (0, 0), with concentration
  #   kappa = kappa_max * (1 - exp(-r / r0)),  r = distance from the origin.
  # kappa_max (the maximum bias, reached far from the origin; 0 = uniform walk)
  # is set per member from each layer's kappa_max_start / kappa_max_end.
  # Distance over which the bias builds up (kappa reaches ~63% of kappa_max at r = r0).
  r0: 10.0

deposit:
  # After each step the drunk deposits a 2D Gaussian at its new location, with
  # uniformly random axis directions. Variance along the major axis; the minor
  # axis has variance * u, with u uniform in (0, 1].
  variance: 1.0
  # Peak amplitude of the first deposit.
  initial_amplitude: 1.0
  # Geometric decay: the k-th deposit has amplitude initial_amplitude * decay**k.
  decay: 0.999

plot:
  # Side of the square map area, centred on the origin, in walk units. The map
  # wraps around: deposits leaving one edge re-enter at the opposite one, so
  # there are no edge effects and the map tiles seamlessly. Each layer's
  # drunks start at Poisson-disk sampled points (no two closer than a minimum
  # spacing, chosen automatically from the number of drunks, measured across
  # the edges) in this square, and are biased back towards their start point.
  # The whole map is a Cities: Skylines II world map (cs2.world_width_km
  # across): 96 units, the area the terrain was tuned at, are one 14.336 km
  # playable area, so the 57.344 km world is 384 units.
  domain: 384.0
  # Resolution (points per side) of the grid used to render the summed deposits.
  # 1600 keeps 4.17 points per unit, so a playable area is 400 x 400 points.
  grid_points: 1600
  # Each Gaussian is only evaluated where it exceeds cutoff x its peak, i.e.
  # within sqrt(2 ln(1/cutoff)) standard deviations of its centre (~4.08 sd
  # for 1/4096). Skipping the negligible tails makes rendering much faster.
  # Must be in (0, 1).
  cutoff: 0.000244140625  # 1/4096

sea:
  # Fraction of the map that is sea. Sea level is set to the height below which
  # this fraction of the map lies, so every map gets the same share of water
  # whatever its height distribution. Heights are not changed. 0 = no sea.
  water_fraction: 0.4

drainage:
  # Fill hollows (app/drainage.py, priority-flood) so every land cell drains
  # to the sea: each hollow is raised to its spill level plus a tiny gradient.
  # The generated terrain has ~11% of its land in depressions (real terrain
  # ~1.5%); filling lets water reach the sea instead of pooling (needed for
  # Cities: Skylines II's water). River carving fills before and after itself;
  # with rivers disabled, this fill is applied on its own.
  fill: true
  # Gradient left across filled hollows, in normalised height per cell.
  epsilon: 0.000001

rivers:
  # River drunks (app/rivers.py) walk from sources down the drainage, meander,
  # join each other as tributaries or reach the sea, and carve graded valleys:
  # riverbed slope ~ catchment area^-concavity, valley width ~ sqrt(area).
  # Applied after sea level is set. Lengths in grid cells, so these depend on
  # plot.grid_points. Defaults tuned with util/river_experiment*.yaml: channel
  # concavity goes from ~0.10 (drained only) to ~0.33, matching real terrain.
  enabled: true
  # Number of river sources (Poisson-disk sampled; those in the sea are dropped).
  # 1600 over the world is 100 per playable area, the tuned density.
  sources: 1600
  # Sources must be this far above sea level (fraction of the land's height range).
  min_source_height: 0.05
  # Gaussian smoothing (cells) of the downstream-direction field the drunks follow.
  direction_smoothing: 2.0
  # von Mises concentration around the downstream direction (lower = more meandering).
  kappa: 16.0
  # Share of the previous heading kept each step.
  inertia: 0.5
  # Concavity of the graded riverbed: bed slope ~ area^-concavity.
  concavity: 0.45
  # Valley half-width (Gaussian sigma, cells) = valley_width * sqrt(catchment cells).
  valley_width: 0.03
  # Narrowest valley sigma, in cells.
  min_valley_sigma: 1.0
  # Flat valley floor (prototype): within floor_width * sqrt(catchment cells) of the
  # channel, terrain is lowered to the riverbed, and the Gaussian valley
  # sides start beyond it. 0 = no floor (V-shaped valleys).
  floor_width: 0.0
  # Steps without getting closer to the sea before switching to steepest descent.
  stall_steps: 50

cs2:
  # Cities: Skylines II heightmaps are 4096 x 4096, 16-bit greyscale: values
  # 0-65535 span 0 to this height (m) at the editor's default height scale.
  max_height_m: 4096.0
  # The whole generated map (plot.domain) is a world map this many km across:
  # CS2's optional world map, also 4096 x 4096 (14 m per pixel), is 57,344 m.
  world_width_km: 57.344
  # The playable area, which a heightmap covers (4096 x 4096, 3.5 m per pixel),
  # is 14,336 m across, the central quarter of the world map. In the web UI
  # you pick where on the world it lies.
  playable_width_km: 14.336
  # The map editor's sea level (m), the default for the web UI's sea-level
  # field. Exported heights are shifted so the model's sea level lands here,
  # so the coastline in the game matches the map. The editor allows 0-2000 m.
  # 511.7 m is the editor's default: it resets to it every time the editor is
  # opened (observed in the game; not documented online).
  editor_sea_level_m: 511.7

ui:
  # Web UI (app/ui.py): served at http://<host>:<port>/.
  host: 127.0.0.1
  port: 9000
  # Open the page in the default web browser when the server starts.
  open_browser: true
  # Vertical-scale slider: metres per unit of normalised height, i.e. from the
  # world's lowest to its highest point. Sets the map's labels and the export
  # (app/heights.py). 3500 m puts the highest peaks at about 3,500 m, inside
  # CS2's 4096 m, with lowlands of ~7 degrees, midlands ~9 and highlands ~12.
  # Matching real cities' highland slopes (18.4 degrees) would need ~5300 m
  # (util/nature_check.py --at-calibrated-scale), above CS2's range. Lower is
  # gentler, higher more mountainous. Ranges up to cs2.max_height_m.
  vertical_scale_m: 3500.0
  vertical_scale_min_m: 100.0
  vertical_scale_step_m: 10.0
  # Sea slider (applies at Generate; rivers depend on it): the share of the map
  # that is sea, defaulting to sea.water_fraction, up to this maximum.
  sea_fraction_max: 0.95

paths:
  # Folder where generated outputs are written (created if missing).
  output_dir: output
